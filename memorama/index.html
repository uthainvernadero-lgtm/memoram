<!DOCTYPE html>
<html>
<head>
<title>Memorama VR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>

<a-scene>

<a-assets>

<img id="img1" src="https://raw.githubusercontent.com/uthainvernadero-lgtm/memoram/main/memorama/aimep3.jpg">
<img id="img2" src="https://raw.githubusercontent.com/uthainvernadero-lgtm/memoram/main/memorama/enemigosdemexico.jpg">
<img id="img3" src="https://raw.githubusercontent.com/uthainvernadero-lgtm/memoram/main/memorama/juan.jpg">
<img id="img4" src="https://raw.githubusercontent.com/uthainvernadero-lgtm/memoram/main/memorama/karla.jpg">
<img id="img5" src="https://raw.githubusercontent.com/uthainvernadero-lgtm/memoram/main/memorama/trump.jpg">
<img id="img6" src="https://raw.githubusercontent.com/uthainvernadero-lgtm/memoram/main/memorama/angela.jpg">

<audio id="musica" src="https://raw.githubusercontent.com/uthainvernadero-lgtm/memoram/main/memorama/sonido.mp3"></audio>
<audio id="acierto" src="https://raw.githubusercontent.com/uthainvernadero-lgtm/memoram/main/memorama/acierto.mp3"></audio>
<audio id="error" src="https://raw.githubusercontent.com/uthainvernadero-lgtm/memoram/main/memorama/fa.mp3"></audio>

</a-assets>

<a-sky color="#111"></a-sky>

<!-- MUSICA -->
<a-entity sound="src: #musica; autoplay: true; loop: true; volume:0.5"></a-entity>

<!-- PISO -->
<a-plane position="0 -1 -4" rotation="-90 0 0" width="14" height="14" color="#7BC8A4"></a-plane>

<!-- CONTADOR -->
<a-text 
id="contador"
value="Pares: 0"
position="-1 4 -4"
color="white"
width="6">
</a-text>

<!-- CARTAS -->

<a-plane class="carta interactivo" position="-3 4 -6" width="1.5" height="1.5" color="blue"></a-plane>
<a-plane class="carta interactivo" position="-1 4 -6" width="1.5" height="1.5" color="blue"></a-plane>
<a-plane class="carta interactivo" position="1 4 -6" width="1.5" height="1.5" color="blue"></a-plane>
<a-plane class="carta interactivo" position="3 4 -6" width="1.5" height="1.5" color="blue"></a-plane>

<a-plane class="carta interactivo" position="-3 2 -6" width="1.5" height="1.5" color="blue"></a-plane>
<a-plane class="carta interactivo" position="-1 2 -6" width="1.5" height="1.5" color="blue"></a-plane>
<a-plane class="carta interactivo" position="1 2 -6" width="1.5" height="1.5" color="blue"></a-plane>
<a-plane class="carta interactivo" position="3 2 -6" width="1.5" height="1.5" color="blue"></a-plane>

<a-plane class="carta interactivo" position="-3 0 -6" width="1.5" height="1.5" color="blue"></a-plane>
<a-plane class="carta interactivo" position="-1 0 -6" width="1.5" height="1.5" color="blue"></a-plane>
<a-plane class="carta interactivo" position="1 0 -6" width="1.5" height="1.5" color="blue"></a-plane>
<a-plane class="carta interactivo" position="3 0 -6" width="1.5" height="1.5" color="blue"></a-plane>

<!-- CAMARA -->
<a-entity camera look-controls position="0 1.6 0">
<a-cursor color="yellow" raycaster="objects: .interactivo"></a-cursor>
</a-entity>

</a-scene>

<script>

let seleccionadas = [];
let bloqueo = false;
let pares = 0;
let totalPares = 6;

const cartas = document.querySelectorAll(".carta");
const contador = document.querySelector("#contador");

let imagenes = [
"#img1","#img2","#img3","#img4","#img5","#img6",
"#img1","#img2","#img3","#img4","#img5","#img6"
];

function mezclar(array){
for(let i = array.length-1;i>0;i--){
let j = Math.floor(Math.random()*(i+1));
[array[i],array[j]]=[array[j],array[i]];
}
return array;
}

function reiniciarJuego(){

pares = 0;
contador.setAttribute("value","Pares: 0");

seleccionadas = [];
bloqueo = false;

let mezcla = mezclar([...imagenes]);

cartas.forEach((carta,index)=>{

carta.setAttribute("material","color:blue");

let img = mezcla[index];

carta.dataset.img = img;
carta.dataset.id = img;

});

}

cartas.forEach(function(carta){

let temporizador;

carta.addEventListener("mouseenter", function(){

temporizador = setTimeout(function(){

if(bloqueo) return;

carta.setAttribute("material","src:"+carta.dataset.img+"; side:double");

seleccionadas.push(carta);

if(seleccionadas.length == 2){

bloqueo = true;

let id1 = seleccionadas[0].dataset.id;
let id2 = seleccionadas[1].dataset.id;

if(id1 == id2){

document.querySelector("#acierto").play();

pares++;
contador.setAttribute("value","Pares: "+pares);

seleccionadas = [];
bloqueo = false;

if(pares == totalPares){

setTimeout(function(){

alert("🎉 GANASTE 🎉");
reiniciarJuego();

},1000);

}

}else{

document.querySelector("#error").play();

setTimeout(function(){

seleccionadas[0].setAttribute("material","color:blue");
seleccionadas[1].setAttribute("material","color:blue");

seleccionadas = [];
bloqueo = false;

},1200);

}

}

},1000);

});

carta.addEventListener("mouseleave", function(){

clearTimeout(temporizador);

});

});

reiniciarJuego();

</script>

</body>
</html>
